name: private payment CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Fazer checkout do repositório
        uses: actions/checkout@v4
      - name: Definir versão do node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm ci
      - name: Iniciar a API
        run: npm start &
      - name: Esperar a API iniciar
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:4000/graphql && exit 0
            sleep 1
          done
          exit 1
      - name: Executar testes
        run: npm test