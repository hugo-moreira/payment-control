name: private payment CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
pull_request:
  branches:
    - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Fazer checkout do repositório
        uses: actions/checkout@v2
      - name:  definir versão do node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm install
      - name: Iniciar a API
        run: npm start &
      - name: Esperar a API iniciar
        run: sleep 10
      - name: Executar testes
        run: npm test
   